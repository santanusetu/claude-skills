name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests for every skill
        run: |
          for d in evals/*/; do
            echo "== $d"
            python -m unittest discover -s "$d"
          done
      - name: Privacy check (built-in rules)
        run: python tools/privacy_check.py
